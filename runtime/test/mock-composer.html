<!doctype html>
<html>
<head><meta charset="utf-8"><title>composer mock</title></head>
<body>
  <div data-chat-session-composer-dock="true">
    <div class="shrink-0 bg-bg-layout px-5 pb-1.5 pt-1" data-conversation-composer="true">
      <div class="mx-auto w-full max-w-[600px]">
        <div class="-ml-1 flex min-h-[18px] min-w-0 flex-nowrap items-center gap-2 overflow-hidden mt-1.5"
             aria-label="当前任务上下文" data-conversation-context-strip="true">
          <div class="inline-flex min-w-0"><span>工作区</span></div>
          <span class="inline-flex "><span>本地</span></span>
          <div class="ml-auto shrink-0">
            <button type="button" aria-label="完整模型请求占用 11%" data-chat-context-usage-progress="true"
                    data-chat-context-usage-surface="true" class="inline-flex shrink-0 items-center gap-1 p-0 text-[10px]">
              <span class="relative h-1.5 w-[48px]"></span><span class="min-w-[22px] text-right">11%</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
